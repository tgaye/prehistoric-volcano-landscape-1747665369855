<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prehistoric Volcano Landscape</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            position: relative;
        }
        #ui-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            width: 200px;
            transition: all 0.3s ease;
        }
        #ui-panel.hidden {
            transform: translateX(220px);
        }
        #toggle-ui {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
        }
        .control-group {
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .control-group h3 {
            margin: 5px 0;
            font-size: 14px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        label {
            font-size: 12px;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            background: #4a4a4a;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin: 2px;
            font-size: 12px;
        }
        button:hover {
            background: #5a5a5a;
        }
        .value-display {
            font-size: 12px;
            min-width: 30px;
            text-align: right;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
        }
    </style>

<base target="_self">
</head>
<body>
    <div id="canvas-container"></div>
    <button id="toggle-ui">☰</button>
    <div id="ui-panel">
        <div class="control-group">
            <h3>Volcano Controls</h3>
            <div class="control-row">
                <label for="eruption-power">Eruption Power:</label>
                <span id="eruption-power-value" class="value-display">50</span>
            </div>
            <input type="range" id="eruption-power" min="10" max="100" value="50">
            
            <div class="control-row">
                <label for="lava-amount">Lava Amount:</label>
                <span id="lava-amount-value" class="value-display">50</span>
            </div>
            <input type="range" id="lava-amount" min="10" max="100" value="50">
        </div>
        
        <div class="control-group">
            <h3>Environment</h3>
            <div class="control-row">
                <label for="dino-count">Dinosaur Count:</label>
                <span id="dino-count-value" class="value-display">5</span>
            </div>
            <input type="range" id="dino-count" min="1" max="15" value="5">
            
            <div class="control-row">
                <label for="wind-direction">Wind Direction:</label>
                <span id="wind-direction-value" class="value-display">0</span>
            </div>
            <input type="range" id="wind-direction" min="-1" max="1" step="0.1" value="0">
        </div>
        
        <div class="control-group">
            <button id="trigger-eruption">Trigger Eruption</button>
            <button id="reset-sim">Reset Simulation</button>
            <button id="randomize">Randomize</button>
        </div>
    </div>
    
    <div id="instructions">
        <strong>Controls:</strong><br>
        - Press SPACE to trigger eruption<br>
        - Click to scare dinosaurs<br>
        - Drag to create wind currents<br>
        - UI panel can be toggled with ☰ button
    </div>

    <script>
        const sketch = (p) => {
            // Simulation parameters
            let params = {
                eruptionPower: 50,
                lavaAmount: 50,
                dinoCount: 5,
                windDirection: 0,
                eruptionActive: false,
                eruptionTime: 0,
                mouseWind: false,
                mouseWindPos: null,
                mouseWindStrength: 0
            };
            
            // Graphics buffers
            let terrainBuffer;
            let lavaBuffer;
            let smokeBuffer;
            
            // Simulation elements
            let dinosaurs = [];
            let lavaParticles = [];
            let smokeParticles = [];
            let ashParticles = [];
            let trees = [];
            let rocks = [];
            
            // Terrain data
            let terrain = [];
            const terrainWidth = 100;
            const terrainResolution = 10;
            let terrainHeightMap = [];
            
            // Colors
            const colors = {
                skyDay: [135, 206, 235],
                skyDusk: [253, 94, 83],
                ground: [139, 69, 19],
                lava: [255, 100, 0],
                lavaCool: [150, 50, 0],
                dinoBody: [100, 150, 100],
                dinoUnder: [80, 120, 80],
                treeTrunk: [101, 67, 33],
                treeLeaves: [34, 139, 34],
                rock: [100, 100, 100]
            };
            
            // Audio context
            let audioContext;
            let eruptionSound;
            
            p.preload = function() {
                // Load any assets here if needed
            };
            
            p.setup = function() {
                const canvasWidth = Math.min(1200, p.windowWidth - 20);
                const canvasHeight = Math.min(800, p.windowHeight - 20);
                let canvas = p.createCanvas(canvasWidth, canvasHeight);
                canvas.parent('canvas-container');
                
                // Initialize graphics buffers
                terrainBuffer = p.createGraphics(p.width, p.height);
                lavaBuffer = p.createGraphics(p.width, p.height);
                smokeBuffer = p.createGraphics(p.width, p.height);
                
                // Setup UI controls
                setupUIControls();
                
                // Generate terrain
                generateTerrain();
                
                // Create environment
                createEnvironment();
                
                // Create dinosaurs
                createDinosaurs();
                
                // Setup audio (will be initialized on first interaction)
                setupAudio();
                
                p.colorMode(p.RGB, 255);
                p.noStroke();
            };
            
            function setupUIControls() {
                // Get references to UI elements
                const uiPanel = document.getElementById('ui-panel');
                const toggleUI = document.getElementById('toggle-ui');
                const eruptionPowerSlider = document.getElementById('eruption-power');
                const lavaAmountSlider = document.getElementById('lava-amount');
                const dinoCountSlider = document.getElementById('dino-count');
                const windDirectionSlider = document.getElementById('wind-direction');
                const triggerEruptionBtn = document.getElementById('trigger-eruption');
                const resetSimBtn = document.getElementById('reset-sim');
                const randomizeBtn = document.getElementById('randomize');
                
                // Update display values
                const eruptionPowerValue = document.getElementById('eruption-power-value');
                const lavaAmountValue = document.getElementById('lava-amount-value');
                const dinoCountValue = document.getElementById('dino-count-value');
                const windDirectionValue = document.getElementById('wind-direction-value');
                
                // Toggle UI panel
                toggleUI.addEventListener('click', () => {
                    uiPanel.classList.toggle('hidden');
                });
                
                // Slider event handlers
                eruptionPowerSlider.addEventListener('input', (e) => {
                    params.eruptionPower = parseInt(e.target.value);
                    eruptionPowerValue.textContent = params.eruptionPower;
                });
                
                lavaAmountSlider.addEventListener('input', (e) => {
                    params.lavaAmount = parseInt(e.target.value);
                    lavaAmountValue.textContent = params.lavaAmount;
                });
                
                dinoCountSlider.addEventListener('input', (e) => {
                    params.dinoCount = parseInt(e.target.value);
                    dinoCountValue.textContent = params.dinoCount;
                    createDinosaurs();
                });
                
                windDirectionSlider.addEventListener('input', (e) => {
                    params.windDirection = parseFloat(e.target.value);
                    windDirectionValue.textContent = params.windDirection.toFixed(1);
                });
                
                // Button event handlers
                triggerEruptionBtn.addEventListener('click', () => {
                    triggerEruption();
                });
                
                resetSimBtn.addEventListener('click', () => {
                    resetSimulation();
                });
                
                randomizeBtn.addEventListener('click', () => {
                    randomizeParams();
                });
            }
            
            function setupAudio() {
                // This will be initialized on first user interaction
                document.addEventListener('click', initAudio, { once: true });
            }
            
            function initAudio() {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Create a simple oscillator for eruption sound
                    eruptionSound = {
                        osc: audioContext.createOscillator(),
                        gain: audioContext.createGain()
                    };
                    eruptionSound.osc.type = 'sawtooth';
                    eruptionSound.gain.gain.value = 0;
                    eruptionSound.osc.connect(eruptionSound.gain);
                    eruptionSound.gain.connect(audioContext.destination);
                    eruptionSound.osc.start();
                } catch (e) {
                    console.log("Audio not supported:", e);
                }
            }
            
            function generateTerrain() {
                terrain = [];
                terrainHeightMap = [];
                
                // Generate height map using noise
                for (let x = 0; x < terrainWidth; x++) {
                    let nx = p.map(x, 0, terrainWidth, 0, 5);
                    let height = p.map(p.noise(nx), 0, 1, 0.3, 0.7) * p.height;
                    
                    // Add volcano shape
                    let volcanoDist = p.abs(x - terrainWidth/2) / (terrainWidth/2);
                    let volcanoHeight = p.map(volcanoDist, 0, 1, 0.8, 0) * 0.4 * p.height;
                    height += volcanoHeight;
                    
                    terrainHeightMap.push(height);
                }
                
                // Create terrain vertices
                for (let x = 0; x < terrainWidth; x++) {
                    let screenX = p.map(x, 0, terrainWidth-1, 0, p.width);
                    let height = terrainHeightMap[x];
                    
                    terrain.push({
                        x: screenX,
                        y: height,
                        originalY: height
                    });
                }
            }
            
            function createEnvironment() {
                trees = [];
                rocks = [];
                
                // Create trees
                for (let i = 0; i < 20; i++) {
                    let x = p.random(p.width);
                    let terrainY = getTerrainHeightAt(x);
                    
                    // Don't place trees on volcano
                    if (x > p.width*0.4 && x < p.width*0.6) continue;
                    
                    trees.push({
                        x: x,
                        y: terrainY,
                        width: p.random(10, 20),
                        height: p.random(30, 60),
                        sway: p.random(0.1, 0.3)
                    });
                }
                
                // Create rocks
                for (let i = 0; i < 15; i++) {
                    let x = p.random(p.width);
                    let terrainY = getTerrainHeightAt(x);
                    
                    rocks.push({
                        x: x,
                        y: terrainY,
                        size: p.random(10, 30),
                        rotation: p.random(p.TWO_PI)
                    });
                }
            }
            
            function createDinosaurs() {
                dinosaurs = [];
                
                for (let i = 0; i < params.dinoCount; i++) {
                    let x, y;
                    let validPosition = false;
                    let attempts = 0;
                    
                    // Find valid position not on volcano
                    while (!validPosition && attempts < 100) {
                        x = p.random(p.width);
                        y = getTerrainHeightAt(x);
                        
                        // Don't place on volcano
                        if (x < p.width*0.4 || x > p.width*0.6) {
                            validPosition = true;
                        }
                        attempts++;
                    }
                    
                    if (validPosition) {
                        dinosaurs.push(new Dinosaur(x, y));
                    }
                }
            }
            
            function getTerrainHeightAt(x) {
                let index = p.constrain(p.floor(p.map(x, 0, p.width, 0, terrainWidth-1)), 0, terrainWidth-1);
                return terrainHeightMap[index];
            }
            
            function triggerEruption() {
                params.eruptionActive = true;
                params.eruptionTime = p.millis();
                
                // Play eruption sound if audio is available
                if (eruptionSound) {
                    eruptionSound.osc.frequency.setValueAtTime(80, audioContext.currentTime);
                    eruptionSound.gain.gain.cancelScheduledValues(audioContext.currentTime);
                    eruptionSound.gain.gain.setValueAtTime(0.5, audioContext.currentTime);
                    eruptionSound.gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 5);
                }
                
                // Scare dinosaurs
                for (let dino of dinosaurs) {
                    if (p.dist(dino.pos.x, dino.pos.y, p.width/2, p.height*0.5) < p.width*0.4) {
                        dino.scare(p.random(-1, 1), -1);
                    }
                }
            }
            
            function resetSimulation() {
                params.eruptionActive = false;
                lavaParticles = [];
                smokeParticles = [];
                ashParticles = [];
                generateTerrain();
                createEnvironment();
                createDinosaurs();
            }
            
            function randomizeParams() {
                params.eruptionPower = p.floor(p.random(30, 80));
                params.lavaAmount = p.floor(p.random(30, 80));
                params.dinoCount = p.floor(p.random(3, 12));
                params.windDirection = p.random(-1, 1);
                
                // Update UI sliders
                document.getElementById('eruption-power').value = params.eruptionPower;
                document.getElementById('lava-amount').value = params.lavaAmount;
                document.getElementById('dino-count').value = params.dinoCount;
                document.getElementById('wind-direction').value = params.windDirection;
                
                // Update display values
                document.getElementById('eruption-power-value').textContent = params.eruptionPower;
                document.getElementById('lava-amount-value').textContent = params.lavaAmount;
                document.getElementById('dino-count-value').textContent = params.dinoCount;
                document.getElementById('wind-direction-value').textContent = params.windDirection.toFixed(1);
                
                createDinosaurs();
            }
            
            p.draw = function() {
                // Update time-based effects
                let time = p.millis() / 1000;
                let dayCycle = p.sin(time * 0.05) * 0.5 + 0.5;
                
                // Draw sky background
                p.background(
                    p.lerp(colors.skyDusk[0], colors.skyDay[0], dayCycle),
                    p.lerp(colors.skyDusk[1], colors.skyDay[1], dayCycle),
                    p.lerp(colors.skyDusk[2], colors.skyDay[2], dayCycle)
                );
                
                // Draw sun/moon
                let sunPos = p.map(dayCycle, 0, 1, p.width*0.8, p.width*0.2);
                p.fill(255, 255, 200);
                p.circle(sunPos, p.height*0.2, 60);
                
                // Update and draw terrain
                updateTerrain();
                drawTerrain();
                
                // Update and draw environment
                drawEnvironment();
                
                // Update and draw lava
                updateLava();
                drawLava();
                
                // Update and draw smoke/ash
                updateSmoke();
                drawSmoke();
                
                // Update and draw dinosaurs
                updateDinosaurs();
                drawDinosaurs();
                
                // Handle eruption effects
                if (params.eruptionActive) {
                    handleEruption();
                }
                
                // Apply mouse wind if active
                if (params.mouseWind && params.mouseWindPos) {
                    let windStrength = params.mouseWindStrength * 0.1;
                    let windVec = p.createVector(p.mouseX - params.mouseWindPos.x, p.mouseY - params.mouseWindPos.y);
                    windVec.normalize().mult(windStrength);
                    
                    for (let particle of smokeParticles) {
                        particle.applyForce(windVec);
                    }
                    for (let particle of ashParticles) {
                        particle.applyForce(windVec);
                    }
                }
                
                // Draw UI overlays
                drawUIOverlays();
            };
            
            function updateTerrain() {
                // Simulate terrain deformation from lava
                for (let i = 0; i < terrain.length; i++) {
                    let point = terrain[i];
                    
                    // Return to original shape slowly
                    point.y = p.lerp(point.y, point.originalY, 0.01);
                    
                    // Check for lava collisions
                    for (let lava of lavaParticles) {
                        if (p.abs(lava.pos.x - point.x) < 10 && lava.pos.y > point.y - 10) {
                            // Melt the terrain
                            point.y += 0.5;
                        }
                    }
                }
            }
            
            function drawTerrain() {
                // Draw ground
                p.fill(colors.ground);
                p.beginShape();
                p.vertex(0, p.height);
                for (let point of terrain) {
                    p.vertex(point.x, point.y);
                }
                p.vertex(p.width, p.height);
                p.endShape(p.CLOSE);
                
                // Draw volcano crater
                p.fill(80, 50, 30);
                p.beginShape();
                let craterWidth = p.width * 0.1;
                let craterHeight = p.height * 0.05;
                p.vertex(p.width/2 - craterWidth, terrainHeightMap[p.floor(terrainWidth/2)] - craterHeight);
                p.vertex(p.width/2, terrainHeightMap[p.floor(terrainWidth/2)] - craterHeight * 1.5);
                p.vertex(p.width/2 + craterWidth, terrainHeightMap[p.floor(terrainWidth/2)] - craterHeight);
                p.endShape(p.CLOSE);
            }
            
            function drawEnvironment() {
                // Draw trees
                for (let tree of trees) {
                    let sway = p.sin(p.frameCount * 0.05 + tree.x) * tree.sway;
                    
                    // Trunk
                    p.fill(colors.treeTrunk);
                    p.push();
                    p.translate(tree.x, tree.y);
                    p.rotate(sway);
                    p.rect(-tree.width/2, -tree.height, tree.width, tree.height);
                    p.pop();
                    
                    // Leaves
                    p.fill(colors.treeLeaves);
                    p.circle(tree.x + sway * 5, tree.y - tree.height, tree.width * 2);
                }
                
                // Draw rocks
                for (let rock of rocks) {
                    p.fill(colors.rock);
                    p.push();
                    p.translate(rock.x, rock.y);
                    p.rotate(rock.rotation);
                    p.rect(-rock.size/2, -rock.size/2, rock.size, rock.size);
                    p.pop();
                }
            }
            
            function handleEruption() {
                let elapsed = p.millis() - params.eruptionTime;
                let eruptionPhase = p.constrain(elapsed / 10000, 0, 1);
                
                // Phase 1: Initial explosion
                if (elapsed < 3000) {
                    let intensity = p.map(elapsed, 0, 3000, 1, 0.5);
                    
                    // Create lava particles
                    if (p.frameCount % 2 === 0) {
                        for (let i = 0; i < params.eruptionPower * 0.2; i++) {
                            let angle = p.random(-p.PI/4, p.PI/4) - p.PI/2;
                            let speed = p.random(5, 15) * intensity;
                            let vel = p.createVector(p.cos(angle) * speed, p.sin(angle) * speed);
                            
                            lavaParticles.push(new LavaParticle(
                                p.width/2 + p.random(-20, 20),
                                terrainHeightMap[p.floor(terrainWidth/2)] - 50,
                                vel,
                                p.random(5, 15)
                            ));
                        }
                    }
                    
                    // Create smoke/ash
                    for (let i = 0; i < params.eruptionPower * 0.1; i++) {
                        let angle = p.random(-p.PI, 0);
                        let speed = p.random(2, 8) * intensity;
                        let vel = p.createVector(p.cos(angle) * speed, p.sin(angle) * speed);
                        
                        smokeParticles.push(new SmokeParticle(
                            p.width/2 + p.random(-30, 30),
                            terrainHeightMap[p.floor(terrainWidth/2)] - 50,
                            vel,
                            p.random(20, 40),
                            p.random(100, 200)
                        ));
                        
                        // Ash particles
                        ashParticles.push(new AshParticle(
                            p.width/2 + p.random(-30, 30),
                            terrainHeightMap[p.floor(terrainWidth/2)] - 50,
                            p.createVector(p.random(-3, 3), p.random(-5, -2)),
                            p.random(3, 8)
                        ));
                    }
                }
                // Phase 2: Sustained eruption
                else if (elapsed < 10000) {
                    let intensity = p.map(elapsed, 3000, 10000, 0.5, 0.2);
                    
                    // Create lava particles
                    if (p.frameCount % 5 === 0) {
                        for (let i = 0; i < params.eruptionPower * 0.1 * intensity; i++) {
                            let angle = p.random(-p.PI/6, p.PI/6) - p.PI/2;
                            let speed = p.random(3, 10) * intensity;
                            let vel = p.createVector(p.cos(angle) * speed, p.sin(angle) * speed);
                            
                            lavaParticles.push(new LavaParticle(
                                p.width/2 + p.random(-20, 20),
                                terrainHeightMap[p.floor(terrainWidth/2)] - 50,
                                vel,
                                p.random(5, 10)
                            ));
                        }
                    }
                    
                    // Create smoke/ash
                    if (p.frameCount % 3 === 0) {
                        for (let i = 0; i < params.eruptionPower * 0.05 * intensity; i++) {
                            let angle = p.random(-p.PI, 0);
                            let speed = p.random(1, 5) * intensity;
                            let vel = p.createVector(p.cos(angle) * speed, p.sin(angle) * speed);
                            
                            smokeParticles.push(new SmokeParticle(
                                p.width/2 + p.random(-30, 30),
                                terrainHeightMap[p.floor(terrainWidth/2)] - 50,
                                vel,
                                p.random(20, 40),
                                p.random(100, 200)
                            ));
                            
                            // Ash particles
                            ashParticles.push(new AshParticle(
                                p.width/2 + p.random(-30, 30),
                                terrainHeightMap[p.floor(terrainWidth/2)] - 50,
                                p.createVector(p.random(-2, 2), p.random(-4, -1)),
                                p.random(3, 8)
                            ));
                        }
                    }
                }
                // End eruption
                else {
                    params.eruptionActive = false;
                }
            }
            
            function updateLava() {
                for (let i = lavaParticles.length - 1; i >= 0; i--) {
                    lavaParticles[i].update();
                    
                    // Remove particles that are off-screen or cooled down
                    if (lavaParticles[i].pos.y > p.height + 50 || 
                        lavaParticles[i].pos.x < -50 || 
                        lavaParticles[i].pos.x > p.width + 50 ||
                        lavaParticles[i].life <= 0) {
                        lavaParticles.splice(i, 1);
                    }
                }
            }
            
            function drawLava() {
                for (let lava of lavaParticles) {
                    lava.display();
                }
            }
            
            function updateSmoke() {
                // Apply wind
                let windForce = p.createVector(params.windDirection * 0.2, 0);
                
                for (let i = smokeParticles.length - 1; i >= 0; i--) {
                    smokeParticles[i].applyForce(windForce);
                    smokeParticles[i].update();
                    
                    // Remove particles that are off-screen or faded out
                    if (smokeParticles[i].pos.y < -50 || 
                        smokeParticles[i].pos.x < -100 || 
                        smokeParticles[i].pos.x > p.width + 100 ||
                        smokeParticles[i].alpha <= 0) {
                        smokeParticles.splice(i, 1);
                    }
                }
                
                for (let i = ashParticles.length - 1; i >= 0; i--) {
                    ashParticles[i].applyForce(windForce);
                    ashParticles[i].update();
                    
                    // Remove particles that are off-screen or settled
                    if (ashParticles[i].pos.y > p.height + 10 || 
                        ashParticles[i].pos.x < -50 || 
                        ashParticles[i].pos.x > p.width + 50 ||
                        ashParticles[i].settled) {
                        ashParticles.splice(i, 1);
                    }
                }
            }
            
            function drawSmoke() {
                p.blendMode(p.BLEND);
                
                // Draw ash first
                for (let ash of ashParticles) {
                    ash.display();
                }
                
                // Draw smoke with additive blending
                p.blendMode(p.ADD);
                for (let smoke of smokeParticles) {
                    smoke.display();
                }
                
                p.blendMode(p.BLEND);
            }
            
            function updateDinosaurs() {
                for (let dino of dinosaurs) {
                    dino.update();
                    
                    // Check if dinosaur is hit by lava
                    for (let lava of lavaParticles) {
                        if (p.dist(dino.pos.x, dino.pos.y, lava.pos.x, lava.pos.y) < dino.size + lava.size) {
                            dino.scare(p.random(-2, 2), -2);
                        }
                    }
                    
                    // Keep dinosaurs on terrain
                    let terrainY = getTerrainHeightAt(dino.pos.x);
                    if (dino.pos.y > terrainY - dino.size/2) {
                        dino.pos.y = terrainY - dino.size/2;
                        dino.vel.y = 0;
                    }
                }
            }
            
            function drawDinosaurs() {
                for (let dino of dinosaurs) {
                    dino.display();
                }
            }
            
            function drawUIOverlays() {
                // Draw eruption warning if active
                if (params.eruptionActive) {
                    p.fill(255, 0, 0, p.sin(p.frameCount * 0.1) * 127 + 128);
                    p.textSize(32);
                    p.textAlign(p.CENTER, p.CENTER);
                    p.text("VOLCANO ERUPTION!", p.width/2, 50);
                }
                
                // Draw wind indicator
                if (params.windDirection !== 0 || params.mouseWind) {
                    p.push();
                    p.translate(30, p.height - 30);
                    p.rotate(p.map(params.windDirection, -1, 1, p.PI/4, -p.PI/4));
                    
                    p.fill(255, 200);
                    p.beginShape();
                    p.vertex(0, 0);
                    p.vertex(20, -10);
                    p.vertex(20, 10);
                    p.endShape(p.CLOSE);
                    
                    p.pop();
                }
            }
            
            // Input handlers
            p.mousePressed = function() {
                if (p.mouseButton === p.LEFT) {
                    // Scare dinosaurs near click
                    for (let dino of dinosaurs) {
                        if (p.dist(dino.pos.x, dino.pos.y, p.mouseX, p.mouseY) < 100) {
                            let dir = p.createVector(dino.pos.x - p.mouseX, dino.pos.y - p.mouseY);
                            dir.normalize().mult(3);
                            dino.scare(dir.x, dir.y);
                        }
                    }
                } else if (p.mouseButton === p.RIGHT) {
                    // Start mouse wind
                    params.mouseWind = true;
                    params.mouseWindPos = p.createVector(p.mouseX, p.mouseY);
                    params.mouseWindStrength = 0;
                }
            };
            
            p.mouseDragged = function() {
                if (params.mouseWind && p.mouseButton === p.RIGHT) {
                    params.mouseWindStrength = p.dist(p.mouseX, p.mouseY, params.mouseWindPos.x, params.mouseWindPos.y);
                }
            };
            
            p.mouseReleased = function() {
                if (p.mouseButton === p.RIGHT) {
                    params.mouseWind = false;
                    params.mouseWindPos = null;
                }
            };
            
            p.keyPressed = function() {
                if (p.key === ' ' && !params.eruptionActive) {
                    triggerEruption();
                } else if (p.key === 'r' || p.key === 'R') {
                    resetSimulation();
                }
            };
            
            p.windowResized = function() {
                const canvasWidth = Math.min(1200, p.windowWidth - 20);
                const canvasHeight = Math.min(800, p.windowHeight - 20);
                p.resizeCanvas(canvasWidth, canvasHeight);
                
                // Regenerate terrain
                generateTerrain();
            };
            
            // Particle classes
            class LavaParticle {
                constructor(x, y, vel, size) {
                    this.pos = p.createVector(x, y);
                    this.vel = vel.copy();
                    this.acc = p.createVector(0, 0);
                    this.size = size;
                    this.life = 100;
                    this.coolRate = p.random(0.5, 1.5);
                }
                
                applyForce(force) {
                    this.acc.add(force);
                }
                
                update() {
                    this.vel.add(this.acc);
                    this.pos.add(this.vel);
                    this.acc.mult(0);
                    
                    // Apply gravity
                    this.vel.y += 0.1;
                    
                    // Cool down over time
                    this.life -= this.coolRate;
                    
                    // Bounce off terrain
                    let terrainY = getTerrainHeightAt(this.pos.x);
                    if (this.pos.y > terrainY - this.size/2) {
                        this.pos.y = terrainY - this.size/2;
                        this.vel.y *= -0.3;
                        this.vel.x *= 0.8;
                    }
                }
                
                display() {
                    let heat = p.map(this.life, 0, 100, 0, 1);
                    p.fill(
                        p.lerp(colors.lavaCool[0], colors.lava[0], heat),
                        p.lerp(colors.lavaCool[1], colors.lava[1], heat),
                        p.lerp(colors.lavaCool[2], colors.lava[2], heat)
                    );
                    
                    p.push();
                    p.translate(this.pos.x, this.pos.y);
                    p.circle(0, 0, this.size);
                    p.pop();
                }
            }
            
            class SmokeParticle {
                constructor(x, y, vel, size, lifespan) {
                    this.pos = p.createVector(x, y);
                    this.vel = vel.copy();
                    this.acc = p.createVector(0, 0);
                    this.size = size;
                    this.maxSize = size;
                    this.lifespan = lifespan;
                    this.life = lifespan;
                    this.alpha = 100;
                }
                
                applyForce(force) {
                    this.acc.add(force);
                }
                
                update() {
                    this.vel.add(this.acc);
                    this.pos.add(this.vel);
                    this.acc.mult(0);
                    
                    // Random movement
                    this.vel.add(p.createVector(p.random(-0.1, 0.1), p.random(-0.1, 0.1)));
                    
                    // Grow over time
                    this.size = p.map(this.life, 0, this.lifespan, this.maxSize*2, this.maxSize);
                    
                    // Fade out
                    this.life--;
                    this.alpha = p.map(this.life, 0, this.lifespan, 0, 100);
                }
                
                display() {
                    p.fill(150, 150, 150, this.alpha);
                    p.circle(this.pos.x, this.pos.y, this.size);
                }
            }
            
            class AshParticle {
                constructor(x, y, vel, size) {
                    this.pos = p.createVector(x, y);
                    this.vel = vel.copy();
                    this.acc = p.createVector(0, 0);
                    this.size = size;
                    this.settled = false;
                    this.rotation = p.random(p.TWO_PI);
                    this.rotationSpeed = p.random(-0.05, 0.05);
                }
                
                applyForce(force) {
                    if (!this.settled) {
                        this.acc.add(force);
                    }
                }
                
                update() {
                    if (!this.settled) {
                        this.vel.add(this.acc);
                        this.pos.add(this.vel);
                        this.acc.mult(0);
                        
                        // Apply gravity
                        this.vel.y += 0.05;
                        
                        // Rotation
                        this.rotation += this.rotationSpeed;
                        
                        // Check if settled on terrain
                        let terrainY = getTerrainHeightAt(this.pos.x);
                        if (this.pos.y > terrainY - this.size/2) {
                            this.pos.y = terrainY - this.size/2;
                            this.settled = true;
                        }
                    }
                }
                
                display() {
                    p.fill(50, 50, 50, 150);
                    p.push();
                    p.translate(this.pos.x, this.pos.y);
                    p.rotate(this.rotation);
                    p.rect(-this.size/2, -this.size/2, this.size, this.size);
                    p.pop();
                }
            }
            
            class Dinosaur {
                constructor(x, y) {
                    this.pos = p.createVector(x, y);
                    this.vel = p.createVector(0, 0);
                    this.acc = p.createVector(0, 0);
                    this.size = p.random(20, 40);
                    this.color = p.color(
                        colors.dinoBody[0] + p.random(-20, 20),
                        colors.dinoBody[1] + p.random(-20, 20),
                        colors.dinoBody[2] + p.random(-20, 20)
                    );
                    this.direction = p.random([-1, 1]);
                    this.walkSpeed = p.random(0.5, 1.5);
                    this.scared = false;
                    this.scareTime = 0;
                    this.legOffset = p.random(p.TWO_PI);
                }
                
                applyForce(force) {
                    this.acc.add(force);
                }
                
                scare(x, y) {
                    this.vel.add(p.createVector(x, y));
                    this.scared = true;
                    this.scareTime = p.millis();
                    this.direction = Math.sign(x) || this.direction;
                }
                
                update() {
                    // Apply acceleration
                    this.vel.add(this.acc);
                    this.pos.add(this.vel);
                    this.acc.mult(0);
                    
                    // Apply gravity
                    this.vel.y += 0.2;
                    
                    // Apply friction
                    this.vel.mult(0.95);
                    
                    // Normal movement
                    if (!this.scared) {
                        if (p.random() < 0.01) {
                            this.direction *= -1;
                        }
                        this.vel.x += this.direction * this.walkSpeed * 0.1;
                    }
                    
                    // Return to normal after being scared
                    if (this.scared && p.millis() - this.scareTime > 5000) {
                        this.scared = false;
                    }
                    
                    // Keep in bounds
                    if (this.pos.x < 0) {
                        this.pos.x = 0;
                        this.vel.x *= -1;
                        this.direction = 1;
                    } else if (this.pos.x > p.width) {
                        this.pos.x = p.width;
                        this.vel.x *= -1;
                        this.direction = -1;
                    }
                }
                
                display() {
                    p.push();
                    p.translate(this.pos.x, this.pos.y);
                    
                    // Legs
                    p.fill(colors.dinoUnder);
                    let legAnimation = p.sin(p.frameCount * 0.1 + this.legOffset) * 5;
                    p.rect(-this.size * 0.3, 0, this.size * 0.15, this.size * 0.5 + legAnimation);
                    p.rect(this.size * 0.15, 0, this.size * 0.15, this.size * 0.5 - legAnimation);
                    
                    // Body
                    p.fill(this.color);
                    p.ellipse(0, -this.size * 0.3, this.size, this.size * 0.6);
                    
                    // Neck and head
                    p.fill(this.color);
                    p.push();
                    p.translate(this.direction * this.size * 0.3, -this.size * 0.3);
                    p.rotate(this.direction * p.PI/4);
                    p.rect(0, -this.size * 0.3, this.direction * this.size * 0.3, this.size * 0.15);
                    p.translate(this.direction * this.size * 0.3, -this.size * 0.3);
                    p.ellipse(0, 0, this.size * 0.3, this.size * 0.2);
                    p.fill(0);
                    p.ellipse(this.direction * this.size * 0.1, -this.size * 0.05, this.size * 0.1, this.size * 0.1);
                    p.pop();
                    
                    // Tail
                    p.fill(this.color);
                    p.push();
                    p.translate(-this.direction * this.size * 0.3, -this.size * 0.3);
                    p.rotate(-this.direction * p.PI/6);
                    p.rect(0, 0, -this.direction * this.size * 0.5, this.size * 0.15);
                    p.pop();
                    
                    p.pop();
                    
                    // Draw scared indicator
                    if (this.scared) {
                        p.fill(255, 0, 0, 100);
                        p.circle(this.pos.x, this.pos.y - this.size, 10);
                    }
                }
            }
        };
        
        new p5(sketch);
    </script>
